# The merge gate for terminal-help.
#
# The code's job is to print a cheat-sheet into an interactive terminal, so the
# CONTENT is not testable — a help file earns its confidence from zsh -n and
# from someone reading the rendered output. The MACHINERY around it is very
# testable, and is tested three ways here: it parses, it loads a real
# ~/.zshrc-user.sh in a throwaway HOME, and it prints what it should when
# driven from a real zsh.
#
# Parsing matters more than usual because lib/*.zsh is sourced from a real
# person's ~/.zshrc, so a syntax error breaks their shell rather than a test
# run.
name: CI

on:
  # Unscoped on purpose. `branches: [main]` would silently exempt a PR stacked
  # on another branch — the one most likely to need checking.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on `main`: its result is the record of what the trunk
  # actually does.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The job id is the status-check context that branch protection requires, so
  # keep it stable: renaming this job silently un-gates the branch, because
  # protection goes on requiring a context that no longer reports.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zsh is NOT preinstalled on ubuntu-latest. check-syntax.sh treats a
      # missing parser as a failure rather than a skip, so forgetting this step
      # turns the gate red instead of quietly halving its coverage.
      #
      # (This comment used to add "pwsh is" — true, but irrelevant since the
      # PowerShell runtime was dropped and PowerShell became a help topic
      # checked as zsh like everything else.)
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Gate — every shell file parses (zsh, bash)
        run: bash scripts/check-syntax.sh

      # Parsing is not behaviour. This one installs into a throwaway HOME,
      # starts a real zsh, and looks for a marker printed by the settings file
      # — the thing that broke twice while every file still parsed perfectly.
      - name: Gate — ~/.zshrc loads ~/.zshrc-user.sh
        run: bash scripts/test-user-file-loads.sh

      # And the test that cannot fail proves nothing: this plants the
      # regression and requires the suite to catch it.
      - name: Gate — the test above can actually fail
        run: bash scripts/test-user-file-loads.sh --self-check

      # bash -n on this runner is bash 5, which parses things macOS's bash 3.2
      # does not. Docker is present on ubuntu-latest, so run the installer on
      # the bash a Mac actually ships — the closest thing to a Mac that can be
      # containerised, and the only part of macOS that has bitten us.
      - name: Gate — the installer works on macOS's bash (3.2)
        run: bash scripts/test-macos-bash.sh

      # The behaviour tier. pytest is the HARNESS, not the subject — every
      # assertion is about the output of a real zsh. It exists because this is
      # a matrix (topics x flag combinations x line counts) and a matrix
      # written as linear bash is a thousand lines nobody reads.
      #
      # uv is NOT preinstalled on ubuntu-latest. test-behaviour.sh treats a
      # missing uv as a failure rather than a skip, so forgetting this step
      # turns the gate red instead of quietly dropping a whole tier.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Gate — behaviour, driving a real zsh
        run: bash scripts/test-behaviour.sh

      # And again: a tier that cannot fail proves nothing. This plants a real
      # defect in a COPY of the tree and requires a NAMED test to catch it.
      - name: Gate — the behaviour tier can actually fail
        run: bash scripts/test-behaviour.sh --self-check

      # The docs make a claim about the code: the README quotes the banner that
      # VERSION feeds. Nothing above compares a document to the code, which is
      # how the README came to advertise v0.14.0 against a VERSION of 0.35.0
      # (#38) with every tier green the whole time.
      #
      # Cheap enough to run last and no runner setup of its own — it is grep
      # and a string compare.
      - name: Gate — the docs quote the version we ship
        run: bash scripts/check-docs-version.sh

      # Same rule as the two tiers above: prove it can fail. This one plants
      # the wrong version in a throwaway copy, never in the checkout.
      - name: Gate — the docs-version gate can actually fail
        run: bash scripts/check-docs-version.sh --self-check
